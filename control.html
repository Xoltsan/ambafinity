<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AmbaFinity - Pusat Interaksi & TikTok Live Hub</title>
  
  <!-- Font Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            background: '#090d16',
            foreground: '#f8fafc',
            card: {
              DEFAULT: '#0f172a',
              foreground: '#f8fafc',
              inner: '#131e36',
              border: '#1e293b'
            },
            primary: {
              DEFAULT: '#38bdf8',
              foreground: '#090d16',
              hover: '#0284c7'
            },
            secondary: {
              DEFAULT: '#1e293b',
              foreground: '#f8fafc'
            },
            muted: {
              DEFAULT: '#1e293b',
              foreground: '#94a3b8'
            },
            accent: {
              DEFAULT: '#f97316',
              foreground: '#ffffff'
            },
            destructive: {
              DEFAULT: '#f43f5e',
              foreground: '#ffffff'
            },
            success: {
              DEFAULT: '#10b981',
              foreground: '#ffffff'
            },
            border: '#202b40'
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone for JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Base Reset & Accessibility Focus Ring */
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #090d16;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    :focus-visible {
      outline: 2px solid #38bdf8;
      outline-offset: 2px;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #090d16;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
  </style>
</head>
<body class="bg-background text-foreground antialiased selection:bg-primary selection:text-primary-foreground">
  <div id="root"></div>

  <!-- React Application Source -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ========================================================================
    // LUCIDE VECTOR ICONS (SVG COMPONENT SET)
    // ========================================================================
    const Icon = ({ name, size = 18, className = "" }) => {
      const icons = {
        zap: (
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
        ),
        music: (
          <>
            <path d="M9 18V5l12-2v13" />
            <circle cx="6" cy="18" r="3" />
            <circle cx="18" cy="16" r="3" />
          </>
        ),
        sliders: (
          <>
            <line x1="4" y1="21" x2="4" y2="14" />
            <line x1="4" y1="10" x2="4" y2="3" />
            <line x1="12" y1="21" x2="12" y2="12" />
            <line x1="12" y1="8" x2="12" y2="3" />
            <line x1="20" y1="21" x2="20" y2="16" />
            <line x1="20" y1="12" x2="20" y2="3" />
            <line x1="1" y1="14" x2="7" y2="14" />
            <line x1="9" y1="8" x2="15" y2="8" />
            <line x1="17" y1="16" x2="23" y2="16" />
          </>
        ),
        activity: (
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
        ),
        flask: (
          <>
            <path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2" />
            <line x1="8.5" y1="2" x2="15.5" y2="2" />
            <path d="M8.5 14h7" />
          </>
        ),
        copy: (
          <>
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
          </>
        ),
        externalLink: (
          <>
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
            <polyline points="15 3 21 3 21 9" />
            <line x1="10" y1="14" x2="21" y2="3" />
          </>
        ),
        plus: (
          <>
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </>
        ),
        trash: (
          <>
            <polyline points="3 6 5 6 21 6" />
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
          </>
        ),
        edit: (
          <>
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
          </>
        ),
        play: (
          <polygon points="5 3 19 12 5 21 5 3" />
        ),
        skipForward: (
          <>
            <polygon points="5 4 15 12 5 20 5 4" />
            <line x1="19" y1="5" x2="19" y2="19" />
          </>
        ),
        video: (
          <>
            <polygon points="23 7 16 12 23 17 23 7" />
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2" />
          </>
        ),
        search: (
          <>
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </>
        ),
        menu: (
          <>
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </>
        ),
        x: (
          <>
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </>
        ),
        check: (
          <polyline points="20 6 9 17 4 12" />
        ),
        heart: (
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
        ),
        gift: (
          <>
            <polyline points="20 12 20 22 4 22 4 12" />
            <rect x="2" y="7" width="20" height="5" />
            <line x1="12" y1="22" x2="12" y2="7" />
            <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z" />
            <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z" />
          </>
        ),
        tv: (
          <>
            <rect x="2" y="7" width="20" height="15" rx="2" ry="2" />
            <polyline points="17 2 12 7 7 2" />
          </>
        ),
        upload: (
          <>
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="17 8 12 3 7 8" />
            <line x1="12" y1="3" x2="12" y2="15" />
          </>
        ),
        alertCircle: (
          <>
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </>
        )
      };

      return (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width={size}
          height={size}
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
          className={className}
          aria-hidden="true"
        >
          {icons[name] || icons.zap}
        </svg>
      );
    };

    // ========================================================================
    // ACCESSIBLE RADIX-STYLE SWITCH COMPONENT
    // ========================================================================
    const Switch = ({ checked, onChange, label, ariaLabel }) => {
      return (
        <button
          type="button"
          role="switch"
          aria-checked={checked}
          aria-label={ariaLabel || label}
          onClick={() => onChange(!checked)}
          className={`relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-background ${
            checked ? 'bg-primary' : 'bg-slate-700'
          }`}
        >
          <span
            className={`pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow-md ring-0 transition duration-200 ease-in-out ${
              checked ? 'translate-x-5' : 'translate-x-0'
            }`}
          />
        </button>
      );
    };

    // ========================================================================
    // TOAST NOTIFICATION COMPONENT
    // ========================================================================
    const Toast = ({ message, type = 'info', onClose }) => {
      useEffect(() => {
        const timer = setTimeout(onClose, 3500);
        return () => clearTimeout(timer);
      }, [onClose]);

      return (
        <div className="fixed bottom-6 right-6 z-50 flex items-center gap-3 rounded-lg border border-border bg-card px-4 py-3 shadow-xl backdrop-blur-md animate-fade-in">
          <Icon name={type === 'success' ? 'check' : 'alertCircle'} size={18} className={type === 'success' ? 'text-success' : 'text-primary'} />
          <span className="text-sm font-medium text-foreground">{message}</span>
          <button
            onClick={onClose}
            aria-label="Tutup notifikasi"
            className="ml-2 text-muted-foreground hover:text-foreground cursor-pointer"
          >
            <Icon name="x" size={14} />
          </button>
        </div>
      );
    };

    // ========================================================================
    // MAIN APP COMPONENT
    // ========================================================================
    function App() {
      const [activeTab, setActiveTab] = useState('pusat-interaksi');
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [status, setStatus] = useState(null);
      const [interactions, setInteractions] = useState([]);
      const [loading, setLoading] = useState(true);
      const [toast, setToast] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      
      // Preset Stream State
      const [activePreset, setActivePreset] = useState('default');
      
      // Modal State
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingItem, setEditingItem] = useState(null);
      const [assetFiles, setAssetFiles] = useState([]);
      const [uploading, setUploading] = useState(false);

      // Form State
      const [formName, setFormName] = useState('');
      const [formCategory, setFormCategory] = useState('jj');
      const [formTriggerType, setFormTriggerType] = useState('gift');
      const [formGiftName, setFormGiftName] = useState('any');
      const [formGiftCoins, setFormGiftCoins] = useState(20);
      const [formLikeCount, setFormLikeCount] = useState(50);
      const [formChatKeyword, setFormChatKeyword] = useState('!hype');
      const [formTitle, setFormTitle] = useState('🔥 SULTAN ALERT: @{user}! 🔥');
      const [formMsg, setFormMsg] = useState('Mengirim {count}x {gift} bernilai {coins} Koin!');
      const [formMediaUrl, setFormMediaUrl] = useState('/assets/jj_baru_2.mp4');
      const [formDuration, setFormDuration] = useState(10);
      const [formAutoEnd, setFormAutoEnd] = useState(true);
      const [formSfx, setFormSfx] = useState('none');
      const [formTts, setFormTts] = useState(false);
      const [formKeystroke, setFormKeystroke] = useState('SPACE');

      // Fetch status and interactions
      const fetchStatus = async () => {
        try {
          const res = await fetch('/api/status');
          const data = await res.json();
          setStatus(data);
        } catch (e) {
          console.error(e);
        }
      };

      const fetchInteractions = async () => {
        try {
          setLoading(true);
          const res = await fetch('/api/interactions');
          const data = await res.json();
          setInteractions(data.interactions || []);
        } catch (e) {
          showToast('Gagal memuat interaksi', 'error');
        } finally {
          setLoading(false);
        }
      };

      const fetchAssets = async () => {
        try {
          const res = await fetch('/api/assets/list');
          const data = await res.json();
          setAssetFiles(data.files || []);
        } catch (e) {
          console.error(e);
        }
      };

      useEffect(() => {
        fetchStatus();
        fetchInteractions();
        fetchAssets();
        const interval = setInterval(fetchStatus, 2000);
        return () => clearInterval(interval);
      }, []);

      const showToast = (message, type = 'info') => {
        setToast({ message, type });
      };

      // Modal ESC key listener
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape' && isModalOpen) {
            setIsModalOpen(false);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isModalOpen]);

      // Open Edit Modal
      const handleOpenEdit = (item) => {
        setEditingItem(item);
        setFormName(item.name || '');
        setFormCategory(item.category || 'jj');
        setFormTriggerType(item.trigger?.type || 'gift');
        setFormGiftName(item.trigger?.giftName || 'any');
        setFormGiftCoins(item.trigger?.minCoins || 20);
        setFormLikeCount(item.trigger?.likeCount || 50);
        setFormChatKeyword(item.trigger?.chatKeyword || '!hype');
        setFormTitle(item.action?.title || '');
        setFormMsg(item.action?.message || '');
        setFormMediaUrl(item.action?.media || item.action?.videoUrl || '/assets/jj_baru_2.mp4');
        setFormDuration(item.action?.duration || 10);
        setFormAutoEnd(item.action?.autoEnd !== false);
        setFormSfx(item.action?.sfx || 'none');
        setFormTts(!!item.action?.tts);
        setFormKeystroke(item.action?.key || 'SPACE');
        setIsModalOpen(true);
      };

      const handleOpenCreate = () => {
        setEditingItem(null);
        setFormName('');
        setFormCategory('jj');
        setFormTriggerType('gift');
        setFormGiftName('any');
        setFormGiftCoins(20);
        setFormLikeCount(50);
        setFormChatKeyword('!hype');
        setFormTitle('🔥 SULTAN ALERT: @{user}! 🔥');
        setFormMsg('Mengirim {count}x {gift} bernilai {coins} Koin!');
        setFormMediaUrl('/assets/jj_baru_2.mp4');
        setFormDuration(10);
        setFormAutoEnd(true);
        setFormSfx('none');
        setFormTts(false);
        setFormKeystroke('SPACE');
        setIsModalOpen(true);
      };

      const handleSaveInteraction = async () => {
        if (!formName.trim()) {
          showToast('Nama interaksi wajib diisi!', 'error');
          return;
        }

        const trigger = { type: formTriggerType };
        if (formTriggerType === 'gift') {
          trigger.giftName = formGiftName.trim() || 'any';
          trigger.minCoins = parseInt(formGiftCoins, 10) || 1;
        } else if (formTriggerType === 'like') {
          trigger.likeCount = parseInt(formLikeCount, 10) || 50;
        } else if (formTriggerType === 'chat') {
          trigger.chatKeyword = formChatKeyword.trim() || '!hype';
        }

        const action = {
          type: formCategory,
          title: formTitle.trim(),
          message: formMsg.trim(),
          media: formMediaUrl.trim(),
          videoUrl: formMediaUrl.trim(),
          sfx: formSfx,
          duration: parseInt(formDuration, 10) || 10,
          autoEnd: formAutoEnd,
          tts: formTts,
          flash: false,
          shake: false,
          key: formKeystroke
        };

        const payload = {
          id: editingItem ? editingItem.id : undefined,
          name: formName.trim(),
          category: formCategory,
          trigger,
          action,
          enabled: editingItem ? editingItem.enabled : true
        };

        try {
          await fetch('/api/interactions/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ interaction: payload })
          });
          showToast('Interaksi berhasil disimpan!', 'success');
          setIsModalOpen(false);
          fetchInteractions();
        } catch (e) {
          showToast('Gagal menyimpan interaksi', 'error');
        }
      };

      const handleToggleInteraction = async (id, currentEnabled) => {
        try {
          await fetch('/api/interactions/toggle', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, enabled: !currentEnabled })
          });
          setInteractions(prev => prev.map(item => item.id === id ? { ...item, enabled: !currentEnabled } : item));
        } catch (e) {
          showToast('Gagal mengubah status', 'error');
        }
      };

      const handleDeleteInteraction = async (id) => {
        if (!confirm('Yakin ingin menghapus interaksi ini?')) return;
        try {
          await fetch('/api/interactions/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id })
          });
          showToast('Interaksi dihapus', 'success');
          fetchInteractions();
        } catch (e) {
          showToast('Gagal menghapus interaksi', 'error');
        }
      };

      const handleTestInteraction = async (id) => {
        try {
          const res = await fetch('/api/interactions/test', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, user: 'Tester_Interaksi' })
          });
          const data = await res.json();
          if (data.success) {
            showToast('Alert uji coba berhasil dikirim ke overlay!', 'success');
          }
        } catch (e) {
          showToast('Gagal menguji interaksi', 'error');
        }
      };

      const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setUploading(true);
        try {
          const res = await fetch(`/api/upload/video?filename=${encodeURIComponent(file.name)}`, {
            method: 'POST',
            body: file
          });
          const data = await res.json();
          if (data.success) {
            setFormMediaUrl(data.url);
            showToast(`Video ${data.filename} berhasil diunggah!`, 'success');
            fetchAssets();
          }
        } catch (err) {
          showToast('Gagal mengunggah video', 'error');
        } finally {
          setUploading(false);
        }
      };

      const handleMasterSwitch = async (key, val) => {
        try {
          await fetch('/api/interactions/master-switch', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ key, value: val })
          });
          fetchStatus();
        } catch (e) {
          showToast('Gagal mengubah sakelar master', 'error');
        }
      };

      const copyObsUrl = () => {
        const url = `${window.location.origin}/overlay`;
        navigator.clipboard.writeText(url);
        showToast('Tautan OBS disalin ke clipboard!', 'success');
      };

      // Filtered interactions
      const filteredInteractions = interactions.filter(item =>
        item.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
        (item.trigger?.giftName || '').toLowerCase().includes(searchQuery.toLowerCase())
      );

      const masterSwitches = status?.masterSwitches || {};

      return (
        <div className="flex min-h-screen bg-background">
          {/* Mobile Sidebar Backdrop */}
          {mobileMenuOpen && (
            <div
              className="fixed inset-0 z-40 bg-black/60 backdrop-blur-sm lg:hidden"
              onClick={() => setMobileMenuOpen(false)}
            />
          )}

          {/* ============================================================
              SIDEBAR NAVIGATION (INDOFINITY STYLE)
              ============================================================ */}
          <aside
            className={`fixed inset-y-0 left-0 z-50 flex w-64 flex-col border-r border-border bg-card transition-transform duration-300 ease-in-out lg:static lg:translate-x-0 ${
              mobileMenuOpen ? 'translate-x-0' : '-translate-x-full'
            }`}
          >
            {/* Brand Header */}
            <div className="flex h-16 items-center justify-between border-b border-border px-6">
              <div className="flex items-center gap-3">
                <div className="flex h-9 w-9 items-center justify-center rounded-lg bg-gradient-to-tr from-accent to-pink-500 font-bold text-white shadow-md">
                  <Icon name="zap" size={20} />
                </div>
                <div>
                  <span className="text-base font-extrabold tracking-tight text-foreground">AmbaFinity</span>
                  <span className="block text-[10px] font-medium text-muted-foreground">TikTok Live Hub</span>
                </div>
              </div>
              <button
                className="lg:hidden text-muted-foreground hover:text-foreground cursor-pointer"
                onClick={() => setMobileMenuOpen(false)}
                aria-label="Tutup menu"
              >
                <Icon name="x" size={20} />
              </button>
            </div>

            {/* Stream Preset Dropdown */}
            <div className="border-b border-border px-6 py-4">
              <label className="text-[11px] font-bold uppercase tracking-wider text-muted-foreground">
                Preset Stream
              </label>
              <select
                value={activePreset}
                onChange={(e) => {
                  setActivePreset(e.target.value);
                  showToast(`Preset diubah ke ${e.target.value}`, 'info');
                }}
                className="mt-1.5 w-full rounded-md border border-border bg-card-inner px-3 py-2 text-xs font-semibold text-foreground focus-visible:ring-1 focus-visible:ring-primary cursor-pointer"
              >
                <option value="default">default</option>
                <option value="chill-stream">chill-stream</option>
                <option value="gaming-rage">gaming-rage</option>
                <option value="music-focus">music-focus</option>
              </select>
            </div>

            {/* Navigation Links */}
            <nav className="flex-1 space-y-6 overflow-y-auto px-4 py-4">
              <div>
                <span className="px-3 text-[11px] font-bold uppercase tracking-wider text-muted-foreground">
                  Setup & Pusat Aksi
                </span>
                <div className="mt-2 space-y-1">
                  <button
                    onClick={() => { setActiveTab('pusat-interaksi'); setMobileMenuOpen(false); }}
                    className={`flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-xs font-semibold transition-colors cursor-pointer ${
                      activeTab === 'pusat-interaksi'
                        ? 'bg-primary/10 text-primary border border-primary/20'
                        : 'text-muted-foreground hover:bg-slate-800/60 hover:text-foreground'
                    }`}
                  >
                    <Icon name="zap" size={16} />
                    <span>Pusat Interaksi</span>

              ============================================================ */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/75 p-4 backdrop-blur-sm animate-fade-in">
              <div
                role="dialog"
                aria-modal="true"
                aria-labelledby="modal-title"
                className="flex max-h-[90vh] w-full max-w-xl flex-col rounded-2xl border border-border bg-card shadow-2xl overflow-hidden"
              >
                {/* Modal Header */}
                <div className="flex items-center justify-between border-b border-border px-6 py-4">
                  <h3 id="modal-title" className="text-base font-extrabold text-foreground">
                    {editingItem ? 'Edit Interaksi' : 'Tambah Interaksi Baru'}
                  </h3>
                  <button
                    onClick={() => setIsModalOpen(false)}
                    aria-label="Tutup modal"
                    className="text-muted-foreground hover:text-foreground cursor-pointer"
                  >
                    <Icon name="x" size={18} />
                  </button>
                </div>

                {/* Modal Form Scroll Area */}
                <div className="flex-1 overflow-y-auto p-6 space-y-4">
                  {/* Nama Interaksi */}
                  <div>
                    <label className="text-xs font-bold text-muted-foreground">Nama Interaksi</label>
                    <input
                      type="text"
                      value={formName}
                      onChange={(e) => setFormName(e.target.value)}
                      placeholder="Contoh: 🔥 SULTAN JEDAG-JEDUG (Gift 20+ Koin)"
                      className="mt-1 w-full rounded-lg border border-border bg-card-inner px-3 py-2 text-xs text-foreground focus-visible:ring-1 focus-visible:ring-primary"
                    />
                  </div>

                  {/* Kategori Aksi & Tipe Trigger */}
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs font-bold text-muted-foreground">Kategori Aksi</label>
                      <select
                        value={formCategory}
                        onChange={(e) => setFormCategory(e.target.value)}
                        className="mt-1 w-full rounded-lg border border-border bg-card-inner px-3 py-2 text-xs text-foreground focus-visible:ring-1 focus-visible:ring-primary cursor-pointer"
                      >
                        <option value="jj">🎬 Video Alert / Jedag-Jedug (Frameless)</option>
                        <option value="alert">🔔 Pop-Up Alert Biasa</option>
                        <option value="keystroke">⌨️ Keystroke Otomatis</option>
                      </select>
                    </div>

                    <div>
                      <label className="text-xs font-bold text-muted-foreground">Pemicu (Trigger)</label>
                      <select
                        value={formTriggerType}
                        onChange={(e) => setFormTriggerType(e.target.value)}
                        className="mt-1 w-full rounded-lg border border-border bg-card-inner px-3 py-2 text-xs text-foreground focus-visible:ring-1 focus-visible:ring-primary cursor-pointer"
                      >
                        <option value="gift">🎁 Menerima Gift</option>
                        <option value="like">❤️ Tap-Tap Layar (Likes)</option>
                        <option value="chat">💬 Kata Kunci di Chat</option>
                        <option value="follow">🌟 Follower Baru</option>
                        <option value="share">🔄 Share Siaran</option>
                      </select>
                    </div>
                  </div>

                  {/* Kondisi Trigger Spesifik */}
                  {formTriggerType === 'gift' && (
                    <div className="grid grid-cols-2 gap-3 rounded-lg border border-border bg-card-inner/50 p-3">
                      <div>
                        <label className="text-[11px] font-bold text-muted-foreground">Nama Gift</label>
                        <input
                          type="text"
                          value={formGiftName}
                          onChange={(e) => setFormGiftName(e.target.value)}
                          placeholder="any (semua jenis gift) atau Rose"
                          className="mt-1 w-full rounded border border-border bg-card-inner px-2 py-1.5 text-xs text-foreground"
                        />
                      </div>
                      <div>
                        <label className="text-[11px] font-bold text-muted-foreground">Minimal Koin</label>
                        <input
                          type="number"
                          value={formGiftCoins}
                          onChange={(e) => setFormGiftCoins(e.target.value)}
                          className="mt-1 w-full rounded border border-border bg-card-inner px-2 py-1.5 text-xs text-foreground font-bold text-primary"
                        />
                      </div>
                    </div>
                  )}

                  {/* Pengaturan Video Asset & Durasi */}
                  {formCategory === 'jj' && (
                    <div className="space-y-3 rounded-xl border border-pink-500/20 bg-pink-500/5 p-4">
                      <div className="flex items-center justify-between">
                        <label className="text-xs font-extrabold text-pink-400">File Video dari Komputer</label>
                        <label className="flex items-center gap-1.5 rounded bg-pink-500/20 border border-pink-500/40 px-2.5 py-1 text-[11px] font-bold text-pink-300 hover:bg-pink-500/30 transition-colors cursor-pointer">
                          <Icon name="upload" size={13} />
                          <span>{uploading ? 'Mengupload...' : 'Pilih File MP4...'}</span>
                          <input type="file" accept="video/mp4,video/webm" onChange={handleFileUpload} className="hidden" />
                        </label>
                      </div>

                      {/* Dropdown File Assets di Server */}
                      {assetFiles.length > 0 && (
                        <div>
                          <label className="text-[11px] text-muted-foreground">Atau pilih video yang sudah diupload:</label>
                          <select
                            value={formMediaUrl}
                            onChange={(e) => setFormMediaUrl(e.target.value)}
                            className="mt-1 w-full rounded border border-border bg-card-inner px-2 py-1.5 text-xs text-foreground cursor-pointer"
                          >
                            {assetFiles.map(f => (
                              <option key={f.url} value={f.url}>{f.name}</option>
                            ))}
                          </select>
                        </div>
                      )}

                      {/* Video Preview */}
                      {formMediaUrl && (
                        <div className="rounded-lg border border-border bg-black/60 p-2">
                          <video
                            src={formMediaUrl}
                            controls
                            className="max-h-36 w-full rounded object-contain bg-black"
                          />
                        </div>
                      )}

                      {/* Pengaturan Durasi */}
                      <div>
                        <div className="flex items-center justify-between">
                          <label className="text-xs font-bold text-muted-foreground">Durasi Ditampilkan di Layar</label>
                          <span className="rounded bg-primary/20 px-2 py-0.5 text-xs font-bold text-primary">
                            {formDuration} Detik
                          </span>
                        </div>
                        <input
                          type="range"
                          min="1"
                          max="60"
                          value={formDuration}
                          onChange={(e) => setFormDuration(parseInt(e.target.value, 10))}
                          className="mt-2 w-full accent-primary cursor-pointer"
                        />
                        <div className="mt-2 flex flex-wrap gap-1.5">
                          {[5, 8, 10, 15, 20, 30].map(s => (
                            <button
                              key={s}
                              type="button"
                              onClick={() => setFormDuration(s)}
                              className={`rounded border px-2 py-0.5 text-[10px] font-bold transition-colors cursor-pointer ${
                                formDuration === s
                                  ? 'bg-primary text-primary-foreground border-primary'
                                  : 'border-border bg-card-inner text-muted-foreground hover:text-foreground'
                              }`}
                            >
                              {s}s
                            </button>
                          ))}
                        </div>
                      </div>

                      <div className="flex items-center gap-2 pt-1">
                        <input
                          type="checkbox"
                          id="modal-auto-end"
                          checked={formAutoEnd}
                          onChange={(e) => setFormAutoEnd(e.target.checked)}
                          className="rounded accent-primary"
                        />
                        <label htmlFor="modal-auto-end" className="text-xs text-muted-foreground cursor-pointer">
                          Selesai otomatis jika video asli habis sebelum durasi selesai
                        </label>
                      </div>
                    </div>
                  )}

                  {/* Efek Suara (SFX) */}
                  <div>
                    <label className="text-xs font-bold text-muted-foreground">Efek Suara Tambahan (SFX)</label>
                    <select
                      value={formSfx}
                      onChange={(e) => setFormSfx(e.target.value)}
                      className="mt-1 w-full rounded-lg border border-border bg-card-inner px-3 py-2 text-xs text-foreground focus-visible:ring-1 focus-visible:ring-primary cursor-pointer"
                    >
                      <option value="none">🔇 Tidak Ada SFX (Gunakan Suara Asli Video)</option>
                      <option value="jj_beat">⚡ Jedag-Jedug (DJ Bass Beat Drop)</option>
                      <option value="bell">🔔 Bell / Chime</option>
                      <option value="fanfare">🎺 Fanfare Kemenangan</option>
                      <option value="pop">🫧 Pop Effect</option>
                    </select>
                  </div>
                </div>

                {/* Modal Footer */}
                <div className="flex items-center justify-end gap-3 border-t border-border px-6 py-4">
                  <button
                    onClick={() => setIsModalOpen(false)}
                    className="rounded-lg border border-border bg-card-inner px-4 py-2 text-xs font-semibold text-muted-foreground hover:text-foreground transition-colors cursor-pointer"
                  >
                    Batal
                  </button>
                  <button
                    onClick={handleSaveInteraction}
                    className="rounded-lg bg-primary px-5 py-2 text-xs font-extrabold text-primary-foreground hover:bg-primary-hover transition-colors cursor-pointer"
                  >
                    Simpan Interaksi
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Toast Notification Container */}
          {toast && (
            <Toast
              message={toast.message}
              type={toast.type}
              onClose={() => setToast(null)}
            />
          )}
        </div>
      );
    }

    // Render Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
